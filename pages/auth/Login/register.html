<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - FastNet</title>
    <link rel="stylesheet" href="register.css">
    <link rel="icon" type="image/png" href="../../../assets/img/LOGO-FASTNET-CIRCULAR.svg">
</head>
<body>

    <div class="register-wrapper">
        <div class="register-card">
            <div class="register-header">
                <a href="sesion.html" class="back-link">← Volver al inicio de sesión</a>
                <div class="logo-container">
                    <img src="../../../assets/img/LOGO-FASTNET-CIRCULAR.svg" alt="FastNet Logo" class="register-logo">
                    <span class="logo-text">Fast<span>Net</span></span>
                </div>
                <h1>Crea tu cuenta</h1>
                <p>Completa tus datos para disfrutar de nuestros servicios</p>
            </div>

            <form id="registerForm" class="register-form">
                <!-- Nombre y Apellido -->
                <div class="form-row">
                    <div class="form-group">
                        <label for="nombre">Nombre</label>
                        <input type="text" id="nombre" name="nombre" required placeholder="Juan">
                    </div>
                    <div class="form-group">
                        <label for="apellido">Apellido</label>
                        <input type="text" id="apellido" name="apellido" required placeholder="Pérez">
                    </div>
                </div>

                <!-- Email -->
                <div class="form-group">
                    <label for="email">Correo electrónico</label>
                    <input type="email" id="email" name="email" required placeholder="correo@ejemplo.com">
                </div>

                <!-- Teléfono -->
                <div class="form-group">
                    <label for="telefono">Teléfono</label>
                    <input type="tel" id="telefono" name="telefono" required placeholder="+58 412-0000000">
                </div>

                <!-- Dirección -->
                <div class="form-group">
                    <label for="direccion">Dirección</label>
                    <input type="text" id="direccion" name="direccion" placeholder="Urbanización, municipio, estado">
                </div>

                <!-- Contraseña -->
                <div class="form-row">
                    <div class="form-group">
                        <label for="password">Contraseña</label>
                        <div class="password-field">
                            <input type="password" id="password" name="password" required placeholder="••••••••">
                            <button type="button" class="toggle-password" data-target="password" aria-label="Mostrar contraseña">👁️</button>
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="confirmar">Confirmar contraseña</label>
                        <div class="password-field">
                            <input type="password" id="confirmar" name="confirmar" required placeholder="••••••••">
                            <button type="button" class="toggle-password" data-target="confirmar" aria-label="Mostrar contraseña">👁️</button>
                        </div>
                    </div>
                </div>

                <!-- Aceptar términos -->
                <div class="form-group checkbox-group">
                  <label class="checkbox-label">
                  <input type="checkbox" id="terminos" required>
                  <span>Acepto los <a href="../../legal/terminos-condiciones.html">términos y condiciones</a> y la <a href="../../legal/politica-privacidad.html">política de privacidad</a>.</span>
              </label>
             </div>

                <button type="submit" class="btn-register">Crear cuenta</button>

                <p class="login-link">¿Ya tienes una cuenta? <a href="sesion.html">Inicia sesión</a></p>
            </form>
        </div>
    </div>

    <script src="../../../assets/js/passwordToggle.js"></script>
    <script src="../../../assets/js/formMessages.js"></script>
    <script>
        // Validación del formulario
        document.getElementById('registerForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const nombre = document.getElementById('nombre').value.trim();
            const apellido = document.getElementById('apellido').value.trim();
            const email = document.getElementById('email').value.trim();
            const telefono = document.getElementById('telefono').value.trim();
            const direccion = document.getElementById('direccion').value.trim();
            const password = document.getElementById('password').value;
            const confirmar = document.getElementById('confirmar').value;
            const terminos = document.getElementById('terminos').checked;

            if (!nombre || !apellido || !email || !telefono || !password || !confirmar) {
                FastNetMessages.showMessage({
                    text: 'Por favor completa todos los campos obligatorios.',
                    type: 'error'
                });
                return;
            }
            if (password !== confirmar) {
                FastNetMessages.showMessage({
                    text: 'Las contraseñas no coinciden.',
                    type: 'error'
                });
                return;
            }
            if (!terminos) {
                FastNetMessages.showMessage({
                    text: 'Debes aceptar los términos y condiciones.',
                    type: 'error'
                });
                return;
            }

            const formData = new FormData();
            formData.append('nombre', nombre);
            formData.append('apellido', apellido);
            formData.append('email', email);
            formData.append('telefono', telefono);
            formData.append('direccion', direccion);
            formData.append('password', password);
            formData.append('confirmar', confirmar);

            try {
                const response = await fetch('../../../src/api/register.php', {
                    method: 'POST',
                    body: formData
                });

                const text = await response.text();
                let result = {};

                try {
                    result = text ? JSON.parse(text) : {};
                } catch (error) {
                    throw new Error(text || 'Error interno del servidor.');
                }

                if (!response.ok) {
                    throw new Error(result.message || 'Error al registrar usuario.');
                }

                FastNetMessages.showMessage({
                    text: result.message || '¡Cuenta creada exitosamente!',
                    type: 'success',
                    duration: 2200
                });

                setTimeout(() => {
                    window.location.href = 'sesion.html';
                }, 700);
            } catch (error) {
                FastNetMessages.showMessage({
                    text: error.message,
                    type: 'error'
                });
            }
        });
    </script>
</body>
</html>
